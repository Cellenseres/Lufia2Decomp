# Whole C7F8 through its RTS. Handlers without native semantics
# (opcodes $49/$4E, BRK targets, bad table entries) stop at their
# exact entry PC so the consumer can finish them in LLE.
[[function]]
address = "83:C7F8"
name = "Lufia2ActorPrimaryUpdate"
source = "src/actor_script.c"
entry_mx = "M1X1"
exit_mx = "M1X0"
status = "verified"

# Whole D508 through its RTS. Handlers still in LLE (6x DAE9, the
# F5B9/F795 tile-graphics family, D76E cell value 9) stop at their
# exact ROM PC.
[[function]]
address = "83:D508"
name = "Lufia2ActorSecondaryUpdate"
source = "src/actor_script.c"
entry_mx = "M1X0"
exit_mx = "M1X0"
status = "verified"

# Whole C1B4 through its RTS. Menu, dialog, vehicle boarding, door
