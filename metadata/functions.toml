format = 1
rom = "lufia2-usa"

# Canonical function metadata. This file alone records, per reconstructed
# routine: ROM address, portable symbol, source file, entry/exit M/X and
# status (identified, draft, verified, disabled). Other files derive from it
# (scripts/metadata_index.py); symbols.toml holds no function state. Names
# are portable semantic symbols, never consumer bridge names. Runtime binding
# is a separate consumer decision (Lufia2SNESRecomp recomp/decomp_bindings.toml);
# verified does not imply bound.

# 40-slot traversal; children go through a JSR callback. D set
# on the way into AB4F stops at $83:BBA1.
[[function]]
address = "83:BB93"
name = "Lufia2UpdateActorSlots"
source = "src/actor/actor_slots.c"
entry_mx = "M1X1"
exit_mx = "M1X1"
status = "verified"

