format = 1
rom = "lufia2-usa"

# 40-slot traversal; children go through a JSR callback. D set
# on the way into AB4F stops at $83:BBA1.
[[function]]
address = "83:BB93"
name = "Lufia2UpdateActorSlots"
source = "src/actor_script.c"
entry_mx = "M1X1"
exit_mx = "M1X1"
status = "verified"

[[function]]
address = "83:BBF3"
name = "Lufia2PlayerSlotSpecialUpdate"
source = "src/player_update.c"
entry_mx = "M1X1"
exit_mx = "M1X1"
status = "verified"

# Whole replacements. Native ABI: M=1, D=0, native mode; other
# entries run in LLE. D350/F9D4/FB71 need 16-bit X, D350 DP page 0.
# Portable D350 also takes X8 (C1B4) and stops at $83:D38D.
[[function]]
address = "83:D350"
name = "Lufia2ActorPrimaryActionCore"
source = "src/actor_script.c"
entry_mx = "M1X0"
exit_mx = "M1X0"
status = "verified"

