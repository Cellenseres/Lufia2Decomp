format = 1
rom = "lufia2-usa"

# Canonical catalog of named work-RAM locations.
#
# Addresses are canonical WRAM addresses in BB:AAAA form. The game reaches
# the low 8 KiB ($7E:0000-$7E:1FFF) through the bank-$00 mirror: as a direct
# page offset while D = 0, as an absolute address while DB is a system bank
# ($00-$3F or $80-$BF), or as a long $00:xxxx address. Such locations are
# recorded here at $7E, which is where the byte physically lives; code that
# reaches them through the mirror keeps its own addressing mode.
#
# Fields:
#   address  first byte, "7E:xxxx" or "7F:xxxx"
#   name     lower_snake_case; unk_<bank><address> when the meaning is not
#            established by verified source, research notes or a verifier
#   width    bytes per element
#   count    elements, for per-slot arrays (default 1)
#   stride   bytes between elements (default width)
#   owner    subsystem that owns the location
#   notes    evidence and addressing remarks
#   aliases  optional names another header uses for the same address
#
# src/system/wram.h is generated from this file by scripts/metadata_index.py:
#   7E:0000-00FF  DP_<NAME>    8-bit direct-page offset (D = 0)
#   7E:0100-1FFF  WRAM_<NAME>  16-bit offset, reached through the mirror
#   other         WRAM_<NAME>  24-bit long address
# Entries must not overlap. The script rejects a WRAM_/DP_ constant in any
# other header that repeats a catalogued address, unless it is an alias.

[[region]]
name = "wram"
start = "7E:0000"
end = "7F:FFFF"
kind = "work_ram"

# Direct page, D = 0 in the field loop.

[[location]]
address = "7E:0042"
name = "frame_counter"
width = 1
owner = "system"
notes = "Frame counter; text opcode $37 waits until it reaches its argument, $38 counts it to 60 per second."

[[location]]
address = "7E:0046"
name = "buttons_held"
width = 2
owner = "system"
notes = "Joypad state as read from the pad: low byte $46 holds A, X, L, R in bits 7-4, high byte $47 holds B, Y, Select, Start, Up, Down, Left, Right in bits 7-0. Distinct from buttons_pressed at $4A; $83:867B takes buttons from $46 and $4A."

[[location]]
address = "7E:004A"
name = "buttons_pressed"
width = 2
owner = "system"
notes = "Pending joypad presses in the same bit layout ($4A low byte, $4B high byte); cleared bit by bit when a handler consumes them ($83:867B TRB)."

[[location]]
address = "7E:0067"
name = "nmi_stub"
width = 5
owner = "system"
notes = "Scene NMI stub JSL target; RTS. Boot writes its opcodes at $80:80E6/$80:80EC; the NMI dispatch at $80:8650 is gated by the target bank byte $6A. Battle setup clears $6A at $81:8644 and publishes bank $85 at $81:864D; exit clears it at $81:87A8."

[[location]]
address = "7E:0594"
name = "nmi_scroll_registers"
width = 2
count = 8
owner = "system"
notes = "Scroll register pairs the NMI copies to $210D-$2114 ($80:87A7): low byte, then high byte of each write-twice register. 82:93F6 reuses bytes0596/0597 as an original display-text word; its phase-specific meaning remains unknown."

[[location]]
address = "7E:0073"
name = "nmi_upload_flags"
width = 1
owner = "system"
notes = "Upload requests for the NMI handlers; bit 0 requests the CGRAM upload of $0320 (set by the field palette effects, cleared by the field NMI)."

[[location]]
address = "7E:008F"
name = "probe_x"
width = 2
owner = "field"
notes = "Tile column scratch: map-cell probes, event spawns at a tile ($80:D4E0, fine position at $83:E018) and the Ancient Cave generator's tile column."
aliases = ["CAVE_DP_TILE_COLUMN"]

[[location]]
address = "7E:0091"
name = "probe_y"
width = 2
owner = "field"
notes = "Tile row scratch, paired with $8F: map-cell probes, event spawns and the Ancient Cave generator's tile row."
aliases = ["CAVE_DP_TILE_ROW"]

[[location]]
address = "7E:00A7"
name = "actor_slot"
width = 1
owner = "actor"
notes = "Current slot index. $83:BB93 walks it from 0 to 39 (STZ $A7, INC); sampler evidence confirms the slot index, not a byte offset. $83:AB4F clears $A8, so a 16-bit LDX $A7 reads the same index. The event loop also passes its slot through $A7 to $83:AB4F."

[[location]]
address = "7E:00A9"
name = "slot_word_offset"
width = 2
owner = "actor"
notes = "$83:AB4F: 2 * $A7 for the word-per-slot arrays (fine positions)."

[[location]]
address = "7E:00AB"
name = "slot_record_offset"
width = 2
owner = "actor"
notes = "$83:AB4F: 3 * $A7 for the 24-bit per-slot records (script cursors, event slot pointers)."
aliases = ["DP_EVENT_SLOT_RECORD"]

# Low WRAM, reached through the bank-$00 mirror.

[[location]]
address = "7E:0320"
name = "cgram_buffer"
width = 2
count = 256
owner = "system"
notes = "CGRAM shadow, one BGR555 word per color; the palette effects write colors here and set $73 bit 0 for the upload. The extent follows the 512-byte CGRAM."

[[location]]
address = "7E:0581"
name = "fade_control"
width = 1
owner = "system"
notes = "Fade request: bit 7 active, bits 0-5 the step added by $80:86C1; text opcode $76 waits on it."

[[location]]
address = "7E:0582"
name = "fade_level"
width = 1
owner = "system"
notes = "Fade level; while $0581 bit 7 is set, $80:86C1 adds its low six bits to this byte."

[[location]]
address = "7E:0583"
name = "brightness"
width = 1
owner = "system"
notes = "INIDISP shadow: $0F full brightness, $80 forced blank (text opcodes $3E/$3F, $81:8528)."

[[location]]
address = "7E:05B5"
