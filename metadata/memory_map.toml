width = 1
owner = "field"
notes = "Field status requests; $83:8103 tests bits 1, 2 and 0 and hands off at the matching call. Whole8103 now executes the original request children;HP and MP requests clear only after the original object-kind search fails."

[[location]]
address = "7E:05D2"
name = "unk_7E05D2"
width = 1
count = 40
owner = "actor"
notes = "Per-slot byte. $FF marks a free slot for the claim search $83:C108; $83:D508 compares it with $80 and $A4; $71..$73 exclude the second occupancy column in $83:FA3F."

[[location]]
address = "7E:05FA"
name = "actor_id"
width = 1
count = 40
owner = "actor"
