owner = "actor"
notes = "Per-slot state bits. Bit 2 skips the slot in $83:BB93 (hidden or free), bits 3-4 and bit 0 steer its children, bit 7 ends $83:C7F8 at its first gate and diverts $83:D508 to $83:D59A, bit 6 is cleared at $83:C829."

[[location]]
address = "7E:064A"
name = "object_state"
width = 1
count = 32
owner = "object"
notes = "Per-object state; bit 7 marks an active object slot ($83:DF87 spawns into the first slot without it), bit 4 makes the object VM yield."

[[location]]
address = "7E:066A"
name = "unk_7E066A"
width = 1
count = 40
owner = "actor"
notes = "Per-slot byte; $83:D508 toggles bit 0 when the walk counter reaches $20."

[[location]]
address = "7E:06BA"
name = "actor_tile_x"
width = 1
count = 40
owner = "actor"
notes = "Tile column per slot; $83:A746 derives the fine x position from it."

[[location]]
address = "7E:06E2"
name = "actor_tile_y"
width = 1
count = 40
owner = "actor"
notes = "Tile row per slot; $83:A746 derives the fine y position from it."

[[location]]
address = "7E:0736"
name = "actor_flags"
width = 1
count = 40
owner = "actor"
notes = "Per-slot flags. Bit 5 marks an actor hidden by event opcode $60; $83:D508 tests bit 7, bits 1 and 6 ($42) and bit 2, and reaches it both DB-relative and as $00:0736."

[[location]]
address = "7E:077E"
